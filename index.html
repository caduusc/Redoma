<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <!-- Viewport mobile + safe-area (iPhone notch) -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <title>Redoma Chat</title>
    <meta name="description" content="Redoma Chat" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1E2A3A" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Redoma" />

    <!-- Android PWA (legado) -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Ícones (coloque esses arquivos em /public/icons/) -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />

    <!-- (Opcional) melhora aparência no iOS quando abrir como app -->
    <meta name="format-detection" content="telephone=no" />

    <!-- (Opcional) previne “flash” de fundo branco -->
    <style>
      html, body {
        height: 100%;
        margin: 0;
        background: #0f172a; /* ajuste se quiser */
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <!-- Vite / React -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
