<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <!-- Viewport mobile + safe-area (iPhone notch) -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <title>Redoma Chat</title>
    <meta name="description" content="Redoma Chat" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1E2A3A" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Redoma" />

    <!-- Android -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Ícones -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Fonte -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Config Tailwind -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              redoma: {
                dark: "#1E2A3A",
                navy: "#151E29",
                steel: "#6B8BA4",
                glow: "#A3BCCB",
                star: "#F4F4DC",
                bg: "#FFFFFF",
                light: "#F9FAFB",
              },
            },
          },
        },
      };
    </script>

    <!-- Base styling -->
    <style>
      html, body {
        height: 100%;
        margin: 0;
        font-family: "Inter", system-ui, -apple-system, Segoe UI, Roboto,
          Helvetica, Arial;
      }
    </style>
  </head>

  <body class="bg-redoma-navy text-slate-100">
    <div id="root"></div>

    <!-- Vite -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
