<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- 🔹 viewport ajustado pro mobile, com viewport-fit pra safe area -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Redoma Chat</title>

    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Redoma" />
    <meta name="theme-color" content="#1E2A3A" />

    <!-- Gera ícone PWA via Canvas (sem precisar subir arquivos PNG) -->
    <script>
      function generateRedomaIcon(size) {
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        const c = size / 2;

        // Fundo arredondado
        ctx.beginPath();
        ctx.arc(c, c, c, 0, Math.PI * 2);
        ctx.fillStyle = '#1E2A3A';
        ctx.fill();

        // Anel
        ctx.beginPath();
        ctx.arc(c, c, c * 0.55, 0, Math.PI * 2);
        ctx.strokeStyle = '#6B8BA4';
        ctx.lineWidth = size / 22;
        ctx.stroke();

        // Ponto central
        ctx.beginPath();
        ctx.arc(c, c, c * 0.12, 0, Math.PI * 2);
        ctx.fillStyle = '#A3BCCB';
        ctx.fill();

        // Pontos orbitais
        [[45, 0.32], [135, 0.28], [225, 0.30], [315, 0.26]].forEach(([angle, r]) => {
          const rad = (angle * Math.PI) / 180;
          const x = c + size * r * Math.cos(rad);
          const y = c + size * r * Math.sin(rad);
          ctx.beginPath();
          ctx.arc(x, y, c * 0.07, 0, Math.PI * 2);
          ctx.fillStyle = '#A3BCCB';
          ctx.fill();
        });

        return canvas.toDataURL('image/png');
      }

      // Cria link de ícone apple-touch dinamicamente
      window.addEventListener('DOMContentLoaded', () => {
        const icon192 = generateRedomaIcon(192);
        window.__redomaIcon192__ = icon192;

        const appleLink = document.createElement('link');
        appleLink.rel = 'apple-touch-icon';
        appleLink.href = icon192;
        document.head.appendChild(appleLink);

        const faviconLink = document.createElement('link');
        faviconLink.rel = 'icon';
        faviconLink.href = generateRedomaIcon(64);
        document.head.appendChild(faviconLink);
      });
    </script>

    <!-- Tailwind via CDN (ok por enquanto) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Fonte -->
    <link
